<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <title>{{ i18n "redirect_title" }}</title>
  </head>
  <body>
    <h1>{{ i18n "redirect_title" }}</h1>
    <p><a href="{{ .Permalink }}">{{ i18n "redirect_continue" }}</a></p>
    <script>window.location.replace({{ .Permalink | jsonify | safeJS }});</script>
  </body>
</html>
