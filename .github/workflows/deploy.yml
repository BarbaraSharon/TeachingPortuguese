name: Deploy website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:
    inputs:
      indexnow_full:
        description: 'Submit the complete current sitemap to IndexNow'
        required: false
        default: false
        type: boolean

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Check deployment configuration
  config:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    outputs:
      deploy-host: ${{ steps.check.outputs.host }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: hugoblox.yaml
        sparse-checkout-cone-mode: false

    - name: Check deploy host
      id: check
      run: |
        # Install pinned yq version for robust YAML parsing
        YQ_VERSION="v4.44.1"
        if ! wget -q --tries=3 --waitretry=1 -O /tmp/yq \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"; then
          echo "::error::Failed to download yq"
          exit 1
        fi
        sudo mv /tmp/yq /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
        
        # Read deploy.host from hugoblox.yaml, default to github-pages
        HOST=$(yq '.deploy.host // ""' hugoblox.yaml 2>/dev/null | grep -v '^null$' || true)
        HOST=${HOST:-github-pages}
        
        # Validate known hosts
        if [[ ! "$HOST" =~ ^(github-pages|netlify|vercel|cloudflare|none)$ ]]; then
          echo "::warning::Unknown deploy host '$HOST', defaulting to github-pages"
          HOST="github-pages"
        fi
        
        echo "host=$HOST" >> $GITHUB_OUTPUT
        echo "Deployment target: $HOST"

  # Build website using reusable workflow (always runs for CI)
  build:
    needs: config
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Deploy website to GitHub Pages hosting (only if configured)
  deploy:
    needs: [config, build]
    if: needs.config.outputs.deploy-host == 'github-pages'
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  indexnow:
    needs: [config, build, deploy]
    if: needs.config.outputs.deploy-host == 'github-pages' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout IndexNow tooling
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          barbarasharon.com.au/scripts/indexnow.mjs
        sparse-checkout-cone-mode: false

    - name: Download IndexNow URL manifests
      uses: actions/download-artifact@v5
      with:
        artifact-ids: ${{ needs.build.outputs.indexnow_artifact_id }}
        path: indexnow

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Submit changed URLs to IndexNow
      env:
        INDEXNOW_FULL: ${{ inputs.indexnow_full || 'false' }}
        INDEXNOW_HOST: barbarasharon.com.au
        INDEXNOW_KEY: f25f2ae156e844228b12042703fb53ed
      run: |
        FULL_FLAG=""
        if [ "$INDEXNOW_FULL" = "true" ]; then FULL_FLAG="--full"; fi
        node barbarasharon.com.au/scripts/indexnow.mjs submit \
          --urls-file indexnow/indexnow-changes.txt \
          --all-file indexnow/indexnow-all.txt \
          --log indexnow-status.log \
          $FULL_FLAG

    - name: Upload IndexNow status log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: indexnow-status-${{ github.run_id }}
        path: indexnow-status.log
        if-no-files-found: ignore
        retention-days: 30
