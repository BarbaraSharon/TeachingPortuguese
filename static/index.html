    <style>
      :root {
        color-scheme: light;
        --ink: #173b2b;
        --forest: #14532d;
        --leaf: #276749;
        --cream: #fcfbf7;
        --mist: #eff6ed;
        --sun: #f8b84e;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 20rem;
        margin: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 0 0, rgb(248 184 78 / 22%), transparent 32rem),
          linear-gradient(145deg, var(--cream), var(--mist));
      }

      main {
        display: grid;
        place-items: center;
        min-height: 100svh;
        padding: clamp(1.5rem, 5vw, 4rem);
      }

      .selector {
        width: min(100%, 43rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(20 83 45 / 14%);
        border-radius: 1.75rem;
        box-shadow: 0 1.5rem 4rem rgb(23 59 43 / 13%);
      }

      .eyebrow {
        margin: 0 0 .8rem;
        color: var(--leaf);
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0 auto 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.8rem);
        font-weight: 600;
        letter-spacing: -.045em;
        line-height: .95;
      }

      .intro {
        max-width: 33rem;
        margin: 0 auto 2.25rem;
        color: #365044;
        font-size: clamp(1rem, 2.6vw, 1.17rem);
        line-height: 1.6;
      }

      .languages {
        display: grid;
        gap: .75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .language-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 4.4rem;
        padding: 1rem 1.2rem;
        color: inherit;
        text-align: left;
        text-decoration: none;
        background: #fff;
        border: 1px solid rgb(20 83 45 / 16%);
        border-radius: .9rem;
        box-shadow: 0 .45rem 1rem rgb(23 59 43 / 6%);
        transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .language-link:hover {
        border-color: var(--leaf);
        box-shadow: 0 .7rem 1.6rem rgb(23 59 43 / 14%);
        transform: translateY(-2px);
      }

      .language-link:focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 3px;
      }

      .language-name { font-size: 1.12rem; font-weight: 750; }
      .language-code { color: var(--leaf); font-size: .78rem; font-weight: 800; letter-spacing: .1em; }

      @media (prefers-reduced-motion: reduce) {
        .language-link { transition: none; }
      }
    </style>
    <script src="/js/language-preference.js" defer></script>
  </head>
  <body>
    <main>
      <section class="selector" aria-labelledby="language-heading">
        <p class="eyebrow">Learn Portuguese with Barbara Sharon</p>
        <h1 id="language-heading">Choose your language</h1>
        <p class="intro">Escolha seu idioma · Elige tu idioma</p>
        <nav aria-label="Choose a language">
          <ul class="languages">
            <li><a class="language-link" href="/en/" data-language-preference="en"><span class="language-name">English</span><span class="language-code">EN</span></a></li>
            <li><a class="language-link" href="/pt-br/" data-language-preference="pt-br" lang="pt-BR"><span class="language-name">Português (Brasil)</span><span class="language-code">PT-BR</span></a></li>
            <li><a class="language-link" href="/es/" data-language-preference="es" lang="es"><span class="language-name">Español</span><span class="language-code">ES</span></a></li>
          </ul>
        </nav>
      </section>
    </main>
  </body>
